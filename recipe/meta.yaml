{% set name = "jupyterlab_widgets" %}
{% set version = "3.0.17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6e61fe21ca8a66039180a5cc52a433e07279d2fee79c8be963e00d55193f17a8

build:
  number: 0
  noarch: python
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.8.1
    - jupyterlab >=4.0,<5.0
    - yarn
  run:
    - python
  run_constrained:
    - jupyterlab >=3,<5

test:
  imports:
    - jupyterlab_widgets
  requires:
    - jupyterlab >=3,<5
    - pip
    - python
  commands:
    - pip check
    - jupyter labextension list --debug

about:
  home: https://github.com/jupyter-widgets/ipywidgets
  summary: Jupyter interactive widgets for JupyterLab
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://github.com/jupyter-widgets/ipywidgets/tree/main/python/jupyterlab_widgets
  dev_url: https://github.com/jupyter-widgets/ipywidgets/tree/main/python/jupyterlab_widgets
  description: |
    A JupyterLab 3.0/4.0 extension for Jupyter/IPython widgets.

extra:
  recipe-maintainers:
    - jasongrout
    - SylvainCorlay
    - martinRenou
    - jtpio
    - bollwyvl
