{% set name = "jupyterlab_widgets" %}
{% set version = "3.0.17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: de496815106e4c0ae0450dc1662cead4cffa43689af359f72d6b4ce8c12f7a8f
  # Build from ipywidgets 8.1.8 monorepo (JS assets from PyPI sdist trigger long path issues on Windows)
  url: https://github.com/jupyter-widgets/ipywidgets/archive/refs/tags/8.1.8.tar.gz
  sha256: de496815106e4c0ae0450dc1662cead4cffa43689af359f72d6b4ce8c12f7a8f

build:
  number: 0
  # noarch, and skipping linux aarch64 as the node build fails on this platform
  skip: true  # [linux and aarch64 or py<37]
  script: |
    jlpm
    jlpm build
    cd python/jupyterlab_widgets
    jlpm clean:all
    jlpm build:prod
    {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.8.1
    - jupyterlab >=4.0,<5.0
    - yarn
    # The Link step on linux-aarch64 gets:
    # @parcel/watcher@npm:2.0.4 couldn't be built successfully
    # which would require the following
    #- make                   # [linux and aarch64]
    #- {{ stdlib('c') }}      # [linux and aarch64]
    #- {{ compiler('c') }}    # [linux and aarch64]
    #- {{ compiler('cxx') }}  # [linux and aarch64]
  run:
    - python
  run_constrained:
    - jupyterlab >=3,<5

test:
  imports:
    - jupyterlab_widgets
  requires:
    - jupyterlab >=3,<5
    - pip
    - python
  commands:
    - pip check
    - jupyter labextension list --debug

about:
  home: https://github.com/jupyter-widgets/ipywidgets
  summary: Jupyter interactive widgets for JupyterLab
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://github.com/jupyter-widgets/ipywidgets/tree/main/python/jupyterlab_widgets
  dev_url: https://github.com/jupyter-widgets/ipywidgets/tree/main/python/jupyterlab_widgets
  description: |
    A JupyterLab 3.0/4.0 extension for Jupyter/IPython widgets.










extra:
  recipe-maintainers:
    - jasongrout
    - SylvainCorlay
    - martinRenou
    - jtpio
    - bollwyvl
